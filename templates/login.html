<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - UMS</title>
    <link href="https://fonts.cdnfonts.com/css/callmira" rel="stylesheet">
    <style>
        :root {
            --color-dark-brown: #60241E;
            --color-brick-red: #95271D;
            --color-dusty-rose: #B34A44;
            --color-terracotta: #E77B49;
            --bg-color: #FAF5F3;
            --card-bg: #FFFFFF;
            --border-color: #E2D3CD;
        }

        * {
            box-sizing: border-box;
            font-family: 'Callmira', serif !important;
            font-weight: normal !important;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--color-dark-brown);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            border: 2px solid var(--color-brick-red);
            padding: 2.5rem;
            border-radius: 8px;
            width: 380px;
            box-shadow: 0 6px 18px rgba(96, 36, 30, 0.1);
        }

        h2 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            color: var(--color-dark-brown);
        }

        p {
            color: var(--color-dusty-rose);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--color-dark-brown);
        }

        input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--color-dark-brown);
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: var(--color-terracotta);
        }

        .btn {
            width: 100%;
            background-color: var(--color-brick-red);
            color: #FFFFFF;
            border: none;
            padding: 0.7rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1rem;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--color-dark-brown);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: var(--color-dusty-rose);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--color-brick-red);
        }

        .flash {
            background-color: #F8D7DA;
            color: #721C24;
            padding: 0.6rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Login</h2>
        <p>Enter administrative credentials to access write controls.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← Return to Home Dashboard</a>
    </div>

</body>
</html>
